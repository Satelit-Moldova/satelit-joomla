name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, curl
          coverage: none
      - name: Lint
        run: find src build tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress
      - name: Offline tests
        run: vendor/bin/phpunit
      - name: Build the package
        run: php build/build.php
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: pkg_satelit
          path: dist/*.zip
